<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WiFi 传输</title>
<style>
  :root {
    --bg: #ededed;
    --panel: rgba(247, 247, 247, 0.92);
    --text: #191919;
    --muted: #8a8a8a;
    --line: rgba(0, 0, 0, 0.08);
    --left: #ffffff;
    --right: #95ec69;
    --right-deep: #7cdf4f;
    --brand: #07c160;
    --danger: #fa5151;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 18% 8%, rgba(7, 193, 96, 0.08), transparent 28%),
      linear-gradient(180deg, #f7f7f7 0%, var(--bg) 45%, #e9e9e9 100%);
    overflow: hidden;
  }

  .app {
    height: 100%;
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: rgba(237, 237, 237, 0.78);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.05);
  }

  .topbar {
    position: relative;
    z-index: 5;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
  }

  .top-row { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #10d56f, #04a85a);
    color: #fff;
    font-size: 20px;
    box-shadow: var(--shadow);
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .title p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #bcbcbc;
    box-shadow: 0 0 0 4px rgba(188, 188, 188, 0.14);
  }
  .status-dot.ok { background: var(--brand); box-shadow: 0 0 0 4px rgba(7, 193, 96, 0.16); }
  .status-dot.err { background: var(--danger); box-shadow: 0 0 0 4px rgba(250, 81, 81, 0.14); }
  .clear-all {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .clear-all:active { background: rgba(0, 0, 0, 0.06); }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .segmented {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.74);
    border-radius: 999px;
    padding: 3px;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
  }
  .segmented button {
    border: 0;
    background: transparent;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
  }
  .segmented button.active {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  }

  .avatar-settings {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .avatar-btn {
    width: 28px;
    height: 28px;
    border: 0;
    background: rgba(255, 255, 255, 0.74);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    transition: transform .12s ease;
  }
  .avatar-btn:active {
    transform: scale(.92);
  }

  .chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 12px 18px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 999px; }

  .time-sep {
    width: fit-content;
    max-width: 80%;
    margin: 12px auto;
    padding: 3px 9px;
    color: #fff;
    background: rgba(0, 0, 0, 0.18);
    border-radius: 999px;
    font-size: 11px;
    line-height: 18px;
  }

  .msg {
    display: flex;
    gap: 8px;
    margin: 8px 0;
    animation: pop .22s ease-out both;
  }
  .msg.left { justify-content: flex-start; }
  .msg.right { justify-content: flex-end; }
  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    font-size: 18px;
    flex: 0 0 auto;
    align-self: flex-start;
    overflow: hidden;
    background: linear-gradient(135deg, #10d56f, #04a85a);
    color: #fff;
  }
  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble-wrap { max-width: min(80%, 640px); position: relative; }
  .sender-label {
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 11px;
    padding: 0 4px;
  }
  .right .sender-label { text-align: right; }
  .bubble {
    position: relative;
    border-radius: 8px;
    padding: 9px 11px;
    line-height: 1.48;
    font-size: 15px;
    word-break: break-word;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
  }
  .left .bubble { background: var(--left); border-top-left-radius: 4px; }
  .right .bubble { background: var(--right); border-top-right-radius: 4px; }
  .right .bubble:active { background: var(--right-deep); }
  .bubble::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
  }
  .left .bubble::after { left: -5px; border-right: 6px solid var(--left); }
  .right .bubble::after { right: -5px; border-left: 6px solid var(--right); }
  .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
  }
  .right .meta { justify-content: flex-end; }
  .delete-one, .copy-one {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    padding: 2px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .delete-one:active { color: var(--danger); background: rgba(250, 81, 81, 0.1); }
  .copy-one:active { color: var(--brand); background: rgba(7, 193, 96, 0.12); }

  .file-card { min-width: min(250px, 72vw); }
  .file-preview {
    display: block;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .file-title {
    display: flex;
    gap: 9px;
    align-items: center;
    font-weight: 650;
    min-width: 0;
  }
  .file-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.48);
    font-size: 18px;
    flex: 0 0 auto;
  }
  .file-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .file-badge {
    flex: 0 0 auto;
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 999px;
    color: rgba(0, 0, 0, 0.64);
    background: rgba(255, 255, 255, 0.5);
  }
  .file-sub {
    margin-top: 3px;
    color: rgba(0, 0, 0, 0.48);
    font-size: 11px;
  }
  .file-link { color: inherit; text-decoration: none; }

  .progress {
    height: 4px;
    margin-top: 9px;
    background: rgba(0, 0, 0, 0.09);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: rgba(0, 0, 0, 0.42);
    border-radius: inherit;
    transition: width .18s ease;
  }
  .upload-stats {
    margin-top: 5px;
    color: rgba(0, 0, 0, 0.48);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  .empty {
    min-height: 60%;
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
  }
  .empty .big { font-size: 34px; display: block; margin-bottom: 8px; }

  .composer {
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--line);
  }
  .selected {
    display: none;
    margin: 0 0 8px;
    padding: 8px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.78);
    color: var(--muted);
    font-size: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }
  .selected.show {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .selected button {
    border: 0;
    background: transparent;
    color: var(--danger);
    font-size: 12px;
    padding: 4px;
  }
  .composer-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .icon-btn, .send-btn {
    border: 0;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease, background .12s ease;
    font-family: inherit;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #fff;
    color: #222;
    font-size: 22px;
    flex: 0 0 auto;
  }
  .icon-btn:active, .send-btn:active { transform: scale(.94); }
  #fileInput { display: none; }
  .input-box {
    flex: 1;
    min-height: 38px;
    max-height: 120px;
    resize: none;
    border: 0;
    outline: 0;
    border-radius: 18px;
    padding: 9px 13px;
    font: inherit;
    font-size: 15px;
    line-height: 20px;
    background: #fff;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
  }
  .send-btn {
    min-width: 58px;
    height: 38px;
    padding: 0 14px;
    border-radius: 18px;
    background: var(--brand);
    color: #fff;
    font-weight: 650;
    flex: 0 0 auto;
  }
  .send-btn:disabled,
  .icon-btn:disabled,
  .segmented button:disabled {
    opacity: .38;
    cursor: default;
  }

  .lan-bar {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 7px 10px;
    border-radius: 12px;
    background: rgba(7, 193, 96, 0.08);
    box-shadow: inset 0 0 0 1px rgba(7, 193, 96, 0.18);
  }
  .lan-bar.show { display: flex; }
  .lan-label { font-size: 12px; color: var(--muted); flex: 0 0 auto; }
  .lan-url {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 650;
    color: var(--brand);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .lan-copy {
    flex: 0 0 auto;
    border: 0;
    background: var(--brand);
    color: #fff;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .lan-copy:active { transform: scale(.94); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(10px);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
    z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-row">
      <div id="deviceAvatar" class="avatar">💻</div>
      <div class="title">
        <h1 id="pageTitle">发送到电脑</h1>
        <p id="statusText">正在连接服务…</p>
      </div>
      <span id="statusDot" class="status-dot"></span>
      <button class="clear-all" onclick="clearHistory()">清空</button>
    </div>
    <div class="toolbar">
      <div class="segmented" aria-label="当前访问设备">
        <button id="devicePhoneBtn" type="button" onclick="setClient('phone')">手机访问</button>
        <button id="deviceComputerBtn" type="button" onclick="setClient('computer')">电脑访问</button>
      </div>
      <div class="segmented" aria-label="发送方">
        <button id="senderPhoneBtn" type="button" onclick="setSender('phone')">手机发送</button>
        <button id="senderComputerBtn" type="button" onclick="setSender('computer')">电脑发送</button>
      </div>
      <div class="avatar-settings">
        <button class="avatar-btn" onclick="handleAvatarUpload('phone')" title="设置手机头像">📱</button>
        <button class="avatar-btn" onclick="handleAvatarUpload('computer')" title="设置电脑头像">💻</button>
      </div>
    </div>
    <div id="lanBar" class="lan-bar">
      <span class="lan-label">📱 手机访问</span>
      <span id="lanUrl" class="lan-url">获取地址中…</span>
      <button id="lanCopyBtn" type="button" class="lan-copy" onclick="copyLanUrl(this)">复制</button>
    </div>
  </header>

  <main id="chat" class="chat">
    <div class="empty"><div><span class="big">💬</span>同一 WiFi 下发送文字和文件<br>消息会像聊天一样显示在这里</div></div>
  </main>

  <footer class="composer">
    <div id="selected" class="selected"></div>
    <div class="composer-row">
      <label class="icon-btn" for="fileInput" title="选择文件">＋</label>
      <input id="fileInput" type="file" multiple>
      <textarea id="textInput" class="input-box" rows="1" placeholder="输入文字…"></textarea>
      <button id="sendBtn" class="send-btn" onclick="sendCurrent()">发送</button>
    </div>
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
let SERVER_OK = false;
let messages = [];
let events = null;
const selectedFiles = [];
let lastRenderSnapshot = '';
let localClientId = localStorage.getItem('wifi-transfer-client-id') || createClientId();
let audioContext = null;
let audioUnlocked = false;
let initialHistoryLoaded = false;

const DEVICE_KEY = 'wifi-transfer-client';
const SENDER_KEY = 'wifi-transfer-sender';
const CLIENT_ID_KEY = 'wifi-transfer-client-id';
const AVATAR_KEY = 'wifi-transfer-avatars';

let clientType = localStorage.getItem(DEVICE_KEY) || detectClientType();
let currentSender = localStorage.getItem(SENDER_KEY) || clientType;

localStorage.setItem(CLIENT_ID_KEY, localClientId);

function detectClientType() {
  const ua = navigator.userAgent || '';
  return /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ? 'phone' : 'computer';
}

function getAvatars() {
  try {
    return JSON.parse(localStorage.getItem(AVATAR_KEY) || '{}');
  } catch {
    return {};
  }
}

function setAvatar(sender, dataUrl) {
  const avatars = getAvatars();
  if (dataUrl) {
    avatars[sender] = dataUrl;
  } else {
    delete avatars[sender];
  }
  localStorage.setItem(AVATAR_KEY, JSON.stringify(avatars));
  renderMessages(true);
}

function getAvatarForSender(sender) {
  const avatars = getAvatars();
  const avatar = avatars[sender];
  if (avatar) {
    return `<img src="${escHtml(avatar)}" alt="${senderName(sender)}">`;
  }
  return sender === 'computer' ? '💻' : '📱';
}

function handleAvatarUpload(sender) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) {
      toastMsg('头像不能超过 500KB');
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      setAvatar(sender, event.target.result);
      toastMsg('头像已更新');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function createClientId() {
  return `client-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function ensureAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!audioContext) {
    audioContext = new AudioContextClass();
  }
  return audioContext;
}

function unlockAudio() {
  const ctx = ensureAudioContext();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }
  audioUnlocked = true;
}

function playToneSequence(notes) {
  const ctx = ensureAudioContext();
  if (!ctx || !audioUnlocked) return;
  if (ctx.state === 'suspended') {
    ctx.resume().catch(() => {});
  }

  const baseTime = ctx.currentTime + 0.01;
  notes.forEach(note => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = note.type || 'sine';
    osc.frequency.setValueAtTime(note.frequency, baseTime + note.offset);
    gain.gain.setValueAtTime(0.0001, baseTime + note.offset);
    gain.gain.exponentialRampToValueAtTime(note.gain || 0.03, baseTime + note.offset + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, baseTime + note.offset + note.duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(baseTime + note.offset);
    osc.stop(baseTime + note.offset + note.duration + 0.02);
  });
}

function playSendSound() {
  playToneSequence([
    { offset: 0, frequency: 880, duration: 0.1, gain: 0.42, type: 'triangle' },
    { offset: 0.08, frequency: 1174, duration: 0.13, gain: 0.33, type: 'triangle' }
  ]);
}

function playReceiveSound() {
  playToneSequence([
    { offset: 0, frequency: 698, duration: 0.09, gain: 0.39, type: 'sine' },
    { offset: 0.07, frequency: 880, duration: 0.13, gain: 0.3, type: 'sine' }
  ]);
}

function toastMsg(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

function formatSize(bytes) {
  if (!bytes && bytes !== 0) return '-';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = bytes;
  let index = 0;
  while (value >= 1024 && index < units.length - 1) {
    value /= 1024;
    index++;
  }
  return `${value.toFixed(index ? 1 : 0)} ${units[index]}`;
}

function formatSpeed(bytesPerSecond) {
  if (!Number.isFinite(bytesPerSecond) || bytesPerSecond <= 0) return '0 KB/s';
  return `${formatSize(bytesPerSecond)}/s`;
}

function formatDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0) return '0秒';
  if (ms < 1000) return `${Math.max(1, Math.round(ms))}毫秒`;
  const seconds = ms / 1000;
  if (seconds < 60) return `${seconds.toFixed(seconds < 10 ? 1 : 0)}秒`;
  const minutes = Math.floor(seconds / 60);
  return `${minutes}分${Math.round(seconds % 60)}秒`;
}

function formatClock(iso) {
  const d = new Date(iso || Date.now());
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hhmm = d.toLocaleTimeString('zh-CN', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
  if (sameDay) return hhmm;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hhmm}`;
}

function shouldShowTime(prev, current) {
  if (!prev) return true;
  return new Date(current.time) - new Date(prev.time) > 5 * 60 * 1000;
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function normalizeName(name) {
  return String(name || '').replace(/\\/g, '/').split('/').pop();
}

function absoluteUploadUrl(url) {
  return new URL(url || '/', location.origin).href;
}

function openPreview(url) {
  if (!url) return;
  window.open(url, '_blank', 'noopener');
}

function fileLabel(category) {
  if (category === 'image') return '图片';
  if (category === 'video') return '视频';
  if (category === 'audio') return '音频';
  return '文件';
}

function fileIcon(category) {
  if (category === 'image') return '🖼';
  if (category === 'video') return '🎬';
  if (category === 'audio') return '🎵';
  return '📄';
}

function senderName(sender) {
  return sender === 'computer' ? '电脑' : '手机';
}

function chatSide(item) {
  return item.sender === clientType ? 'right' : 'left';
}

function messageHtml(item) {
  const side = chatSide(item);
  const canDelete = item.id && !String(item.id).startsWith('local-');
  const metaParts = [formatClock(item.time)];
  if (item.type === 'file') metaParts.push(formatSize(item.size));
  if (item.durationMs) metaParts.push(`耗时 ${formatDuration(item.durationMs)}`);
  if (item.speed) metaParts.push(formatSpeed(item.speed));

  const avatarData = getAvatarForSender(item.sender);
  const avatarHtml = side === 'left'
    ? `<div class="msg-avatar">${avatarData}</div>`
    : '';
  const avatarHtmlRight = side === 'right'
    ? `<div class="msg-avatar">${avatarData}</div>`
    : '';

  let body = '';
  if (item.type === 'text') {
    body = `<div>${escHtml(item.text).replace(/\n/g, '<br>')}</div>`;
  } else {
    const filename = normalizeName(item.filename || '文件');
    const url = absoluteUploadUrl(item.url);
    const category = item.category || 'other';
    const preview = category === 'image'
      ? `<img class="file-preview" src="${escHtml(url)}" alt="${escHtml(filename)}" onclick="openPreview('${escHtml(url)}')">`
      : '';
    const progress = item.progress != null ? `
      <div class="progress"><div class="progress-bar" style="width:${Math.max(0, Math.min(100, item.progress))}%"></div></div>
      <div class="upload-stats"><span>${item.progressText || '上传中'}</span><span>${item.speed ? formatSpeed(item.speed) : ''}</span></div>
    ` : '';
    body = `
      <a class="file-link" href="${escHtml(url)}" download="${escHtml(filename)}">
        ${preview}
        <div class="file-card">
          <div class="file-title">
            <span class="file-icon">${fileIcon(category)}</span>
            <span class="file-name">${escHtml(filename)}</span>
            <span class="file-badge">${fileLabel(category)}</span>
          </div>
          <div class="file-sub">${escHtml(item.uploadText || formatSize(item.size))}</div>
          ${progress}
        </div>
      </a>`;
  }

  return `
    <div class="msg ${side}" data-id="${escHtml(item.id || '')}">
      ${avatarHtml}
      <div class="bubble-wrap">
        <div class="sender-label">${escHtml(senderName(item.sender))}</div>
        <div class="bubble">${body}</div>
        <div class="meta">
          <span>${metaParts.filter(Boolean).join(' · ')}</span>
          ${canDelete ? `<button class="delete-one" onclick="deleteMessage('${escHtml(item.id)}')">删除</button>` : ''}
        </div>
      </div>
      ${avatarHtmlRight}
    </div>`;
}

  return `
    <div class="msg ${side}" data-id="${escHtml(item.id || '')}">
      <div class="bubble-wrap">
        <div class="sender-label">${escHtml(senderName(item.sender))}</div>
        <div class="bubble">${body}</div>
        <div class="meta">
          <span>${metaParts.filter(Boolean).join(' · ')}</span>
          ${item.type === 'text' ? `<button class="copy-one" onclick="copyText(this, '${encodeURIComponent(item.text)}')">复制</button>` : ''}
          ${canDelete ? `<button class="delete-one" onclick="deleteMessage('${escHtml(item.id)}')">删除</button>` : ''}
        </div>
      </div>
    </div>`;
}

function upsertMessage(entry) {
  const index = messages.findIndex(item => item.id === entry.id);
  if (index === -1) {
    messages.push(entry);
  } else {
    messages[index] = { ...messages[index], ...entry };
  }
}

function removeMessage(id) {
  messages = messages.filter(item => item.id !== id);
}

function renderMessages(keepPosition = false) {
  const chat = $('chat');
  const oldBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
  const chronological = [...messages].sort((a, b) => new Date(a.time) - new Date(b.time));
  const renderSnapshot = JSON.stringify(chronological.map(item => ({
    id: item.id,
    type: item.type,
    sender: item.sender,
    time: item.time,
    text: item.text,
    filename: item.filename,
    size: item.size,
    url: item.url,
    category: item.category,
    progress: item.progress,
    progressText: item.progressText,
    uploadText: item.uploadText,
    speed: item.speed,
    durationMs: item.durationMs
  })));

  if (!chronological.length) {
    lastRenderSnapshot = '';
    chat.innerHTML = '<div class="empty"><div><span class="big">💬</span>同一 WiFi 下发送文字和文件<br>消息会像聊天一样显示在这里</div></div>';
    return;
  }

  if (renderSnapshot === lastRenderSnapshot) {
    return;
  }

  let html = '';
  chronological.forEach((item, index) => {
    if (shouldShowTime(chronological[index - 1], item)) {
      html += `<div class="time-sep">${formatClock(item.time)}</div>`;
    }
    html += messageHtml(item);
  });
  chat.innerHTML = html;
  lastRenderSnapshot = renderSnapshot;

  if (keepPosition && oldBottom > 80) {
    chat.scrollTop = chat.scrollHeight - chat.clientHeight - oldBottom;
  } else {
    requestAnimationFrame(() => {
      chat.scrollTop = chat.scrollHeight;
    });
  }
}

function updateUploadProgress(localMessage) {
  const root = document.querySelector(`.msg[data-id="${CSS.escape(localMessage.id)}"]`);
  if (!root) {
    renderMessages(true);
    return;
  }
  const bar = root.querySelector('.progress-bar');
  const stats = root.querySelector('.upload-stats');
  const fileSub = root.querySelector('.file-sub');
  const metaText = root.querySelector('.meta span');
  if (bar) bar.style.width = `${Math.max(0, Math.min(100, localMessage.progress || 0))}%`;
  if (stats) {
    const spans = stats.querySelectorAll('span');
    if (spans[0]) spans[0].textContent = localMessage.progressText || '上传中';
    if (spans[1]) spans[1].textContent = localMessage.speed ? formatSpeed(localMessage.speed) : '';
  }
  if (fileSub) fileSub.textContent = localMessage.uploadText || formatSize(localMessage.size);
  if (metaText) {
    const metaParts = [formatClock(localMessage.time), formatSize(localMessage.size)];
    if (localMessage.durationMs) metaParts.push(`耗时 ${formatDuration(localMessage.durationMs)}`);
    if (localMessage.speed) metaParts.push(formatSpeed(localMessage.speed));
    metaText.textContent = metaParts.filter(Boolean).join(' · ');
  }
}

function updateClientUI() {
  $('devicePhoneBtn').classList.toggle('active', clientType === 'phone');
  $('deviceComputerBtn').classList.toggle('active', clientType === 'computer');
  $('senderPhoneBtn').classList.toggle('active', currentSender === 'phone');
  $('senderComputerBtn').classList.toggle('active', currentSender === 'computer');
  $('deviceAvatar').textContent = clientType === 'phone' ? '📱' : '💻';
  $('pageTitle').textContent = clientType === 'phone' ? '发送到电脑' : '发送到手机';
  updateLanBar();
  renderMessages(true);
}

function updateServerStatus() {
  $('statusDot').className = `status-dot ${SERVER_OK ? 'ok' : 'err'}`;
  $('statusText').textContent = SERVER_OK
    ? `已连接 · 当前页面按${clientType === 'phone' ? '手机' : '电脑'}端展示`
    : '连接中断，正在尝试重连…';
}

function setClient(type) {
  clientType = type === 'computer' ? 'computer' : 'phone';
  localStorage.setItem(DEVICE_KEY, clientType);
  if (!currentSender) currentSender = clientType;
  updateClientUI();
}

function setSender(type) {
  currentSender = type === 'computer' ? 'computer' : 'phone';
  localStorage.setItem(SENDER_KEY, currentSender);
  updateClientUI();
}

async function loadHistory(keepPosition = true) {
  try {
    const r = await fetch('/api/history');
    const d = await r.json();
    const localUploading = messages.filter(x => String(x.id).startsWith('local-'));
    const nextMessages = [...(d.items || []), ...localUploading];
    const currentSnapshot = JSON.stringify(messages.map(item => ({
      id: item.id,
      time: item.time,
      text: item.text,
      filename: item.filename,
      size: item.size,
      url: item.url,
      category: item.category,
      sender: item.sender,
      progress: item.progress,
      progressText: item.progressText,
      uploadText: item.uploadText
    })));
    const nextSnapshot = JSON.stringify(nextMessages.map(item => ({
      id: item.id,
      time: item.time,
      text: item.text,
      filename: item.filename,
      size: item.size,
      url: item.url,
      category: item.category,
      sender: item.sender,
      progress: item.progress,
      progressText: item.progressText,
      uploadText: item.uploadText
    })));
    if (currentSnapshot === nextSnapshot) {
      return;
    }
    messages = nextMessages;
    renderMessages(keepPosition);
  } catch {}
  initialHistoryLoaded = true;
}

function connectEvents() {
  if (events) {
    events.close();
  }
  events = new EventSource('/api/events');
  events.onopen = () => {
    SERVER_OK = true;
    updateServerStatus();
  };
  events.addEventListener('ready', () => {
    SERVER_OK = true;
    updateServerStatus();
  });
  events.addEventListener('history', event => {
    try {
      const payload = JSON.parse(event.data || '{}');
      if (payload.action === 'clear') {
        messages = messages.filter(item => String(item.id).startsWith('local-'));
        renderMessages(true);
        return;
      }
      if (payload.action === 'delete') {
        removeMessage(payload.id);
        renderMessages(true);
        return;
      }
      if (payload.action === 'upsert' && payload.entry) {
        const existed = messages.some(item => item.id === payload.entry.id);
        const isLocalEcho = payload.entry.clientId && payload.entry.clientId === localClientId;
        const localUploadingIndex = messages.findIndex(item =>
          String(item.id).startsWith('local-') &&
          item.clientId === payload.entry.clientId &&
          item.sender === payload.entry.sender &&
          item.filename === payload.entry.filename
        );
        if (localUploadingIndex !== -1) {
          messages.splice(localUploadingIndex, 1);
        }
        upsertMessage(payload.entry);
        renderMessages(true);
        if (initialHistoryLoaded && !existed && !isLocalEcho) {
          playReceiveSound();
        }
      }
    } catch {}
  });
  events.onerror = () => {
    SERVER_OK = false;
    updateServerStatus();
  };
}

function autoResizeInput() {
  const input = $('textInput');
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 120)}px`;
}

$('textInput').addEventListener('input', autoResizeInput);
$('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendCurrent();
  }
});
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('keydown', unlockAudio);

$('fileInput').addEventListener('change', () => {
  const files = Array.from($('fileInput').files || []);
  for (const file of files) {
    if (!selectedFiles.some(x => x.name === file.name && x.size === file.size && x.lastModified === file.lastModified)) {
      selectedFiles.push(file);
    }
  }
  $('fileInput').value = '';
  renderSelected();
});

function renderSelected() {
  const el = $('selected');
  if (!selectedFiles.length) {
    el.className = 'selected';
    el.innerHTML = '';
    return;
  }
  const total = selectedFiles.reduce((sum, file) => sum + file.size, 0);
  const categories = new Set(selectedFiles.map(file => {
    const lower = file.name.toLowerCase();
    if (/\.(jpg|jpeg|png|gif|webp|heic|heif|jfif|bmp|svg)$/.test(lower)) return '图片';
    if (/\.(mp4|mov|m4v|avi|mkv|webm)$/.test(lower)) return '视频';
    if (/\.(mp3|wav|m4a|aac|flac|ogg)$/.test(lower)) return '音频';
    return '文件';
  }));
  const typeText = Array.from(categories).join(' / ');
  const text = selectedFiles.length === 1
    ? `${selectedFiles[0].name} · ${typeText} · ${formatSize(selectedFiles[0].size)}`
    : `${selectedFiles.length} 个项目 · ${typeText} · 共 ${formatSize(total)}`;
  el.className = 'selected show';
  el.innerHTML = `<span>📎 ${escHtml(text)}</span><button onclick="clearSelected()">移除</button>`;
}

function clearSelected() {
  selectedFiles.length = 0;
  renderSelected();
}

function setBusy(busy) {
  $('sendBtn').disabled = busy;
  $('fileInput').disabled = busy;
  $('textInput').disabled = busy;
  $('devicePhoneBtn').disabled = busy;
  $('deviceComputerBtn').disabled = busy;
  $('senderPhoneBtn').disabled = busy;
  $('senderComputerBtn').disabled = busy;
}

async function sendCurrent() {
  if (selectedFiles.length) return sendFiles();
  return sendText();
}

async function sendText() {
  const text = $('textInput').value.trim();
  if (!text) return toastMsg('请输入文字');
  if (!SERVER_OK) return toastMsg('服务未连接');

  setBusy(true);
  try {
    const r = await fetch('/api/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, sender: currentSender, clientId: localClientId })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'send failed');
    upsertMessage(d.entry);
    $('textInput').value = '';
    autoResizeInput();
    renderMessages();
    playSendSound();
  } catch (error) {
    toastMsg(error.message || '发送失败，请重试');
  } finally {
    setBusy(false);
  }
}

async function sendFiles() {
  if (!selectedFiles.length) return toastMsg('请选择文件');
  if (!SERVER_OK) return toastMsg('服务未连接');

  const files = [...selectedFiles];
  const total = files.reduce((sum, file) => sum + file.size, 0);
  const localId = `local-${Date.now()}`;
  const start = performance.now();
  const localMessage = {
    id: localId,
    type: 'file',
    sender: currentSender,
    clientId: localClientId,
    category: files.length === 1 ? guessLocalCategory(files[0].name) : 'other',
    time: new Date().toISOString(),
    filename: files.length === 1 ? files[0].name : `${files.length} 个文件`,
    size: total,
    progress: 0,
    progressText: '准备上传',
    uploadText: `${formatSize(total)} · 正在上传`,
    speed: 0
  };

  selectedFiles.length = 0;
  renderSelected();
  messages.push(localMessage);
  renderMessages();
  setBusy(true);

  try {
    const fd = new FormData();
    fd.append('sender', currentSender);
    fd.append('clientId', localClientId);
    files.forEach(file => fd.append('files', file, file.name));

    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.addEventListener('progress', e => {
        if (!e.total) return;
        const elapsed = performance.now() - start;
        const speed = e.loaded / Math.max(elapsed / 1000, 0.1);
        Object.assign(localMessage, {
          progress: e.loaded / e.total * 100,
          progressText: `${formatSize(e.loaded)} / ${formatSize(e.total)}`,
          speed,
          durationMs: elapsed,
          uploadText: `上传中 · ${formatDuration(elapsed)}`
        });
        updateUploadProgress(localMessage);
      });
      xhr.onload = () => {
        let parsed = {};
        try {
          parsed = JSON.parse(xhr.responseText || '{}');
        } catch {}
        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(parsed);
        } else {
          reject(new Error(parsed.error || '上传失败'));
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(fd);
    });

    const elapsed = performance.now() - start;
    removeMessage(localId);
    for (const entry of result.entries || []) {
      upsertMessage({
        ...entry,
        durationMs: elapsed,
        speed: total / Math.max(elapsed / 1000, 0.1),
        uploadText: `上传完成 · ${formatDuration(elapsed)}`
      });
    }
    renderMessages();
    playSendSound();
    toastMsg('文件已上传');
  } catch (error) {
    Object.assign(localMessage, {
      progress: 100,
      progressText: '上传失败',
      uploadText: error.message || '上传失败，请重试',
      speed: 0,
      durationMs: performance.now() - start
    });
    updateUploadProgress(localMessage);
    toastMsg(error.message || '上传失败，请重试');
  } finally {
    setBusy(false);
  }
}

function guessLocalCategory(filename) {
  const lower = String(filename || '').toLowerCase();
  if (/\.(jpg|jpeg|png|gif|webp|heic|heif|jfif|bmp|svg)$/.test(lower)) return 'image';
  if (/\.(mp4|mov|m4v|avi|mkv|webm)$/.test(lower)) return 'video';
  if (/\.(mp3|wav|m4a|aac|flac|ogg)$/.test(lower)) return 'audio';
  return 'other';
}

async function writeClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}
  // 局域网多为 http，clipboard API 不可用，回退到 execCommand
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch {}
  return false;
}

async function copyText(btn, encoded) {
  const text = decodeURIComponent(encoded || '');
  const ok = await writeClipboard(text);
  if (ok) {
    toastMsg('已复制');
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = original; }, 1200);
    }
  } else {
    toastMsg('复制失败，请手动选择');
  }
}

let lanUrlValue = '';

async function loadLanInfo() {
  try {
    const r = await fetch('/api/info');
    const d = await r.json();
    lanUrlValue = d.url || '';
    if (lanUrlValue) $('lanUrl').textContent = lanUrlValue;
  } catch {}
  updateLanBar();
}

function updateLanBar() {
  // 仅电脑端展示：电脑打开的是 localhost，需把真实局域网地址告诉手机
  const show = clientType === 'computer' && !!lanUrlValue;
  $('lanBar').classList.toggle('show', show);
}

async function copyLanUrl(btn) {
  if (!lanUrlValue) return toastMsg('地址未就绪');
  const ok = await writeClipboard(lanUrlValue);
  if (ok) {
    toastMsg('地址已复制，发到手机打开即可');
    if (btn) {
      const original = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = original; }, 1200);
    }
  } else {
    toastMsg('复制失败，请手动输入');
  }
}

async function deleteMessage(id) {
  if (!id) return;
  if (!confirm('删除这条消息？')) return;
  try {
    const r = await fetch(`/api/history/${encodeURIComponent(id)}`, { method: 'DELETE' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '删除失败');
    messages = messages.filter(item => item.id !== id);
    renderMessages(true);
  } catch (error) {
    toastMsg(error.message || '删除失败');
  }
}

async function clearHistory() {
  if (!messages.length) return;
  if (!confirm('清空所有聊天记录和已上传文件？')) return;
  try {
    const r = await fetch('/api/history', { method: 'DELETE' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '清空失败');
    messages = messages.filter(x => String(x.id).startsWith('local-'));
    renderMessages();
  } catch (error) {
    toastMsg(error.message || '清空失败');
  }
}

setClient(clientType);
setSender(currentSender);
updateServerStatus();
loadHistory(false);
loadLanInfo();
connectEvents();
</script>
</body>
</html>
